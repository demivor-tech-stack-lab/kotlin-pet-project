ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.vehiclerental.ApplicationKt.module

app:
  # true = tu nap du lieu mau khi khoi dong (3 loai xe, 6 xe, 2 tai khoan)
  seedData: true

database:
  # H2 in-memory: khong can cai dat gi, du lieu mat khi tat app.
  # DB_CLOSE_DELAY=-1 giu database song chung nao JVM con chay.
  driver: "org.h2.Driver"
  url: "jdbc:h2:mem:vehiclerental;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
  user: "sa"
  password: ""
  poolSize: 10

jwt:
  # DEV ONLY. That su thi phai doc tu bien moi truong:
  #   secret: "$JWT_SECRET"
  secret: "doi-chuoi-nay-thanh-secret-cua-ban-toi-thieu-32-ky-tu"
  issuer: "vehicle-rental-api"
  audience: "vehicle-rental-users"
  realm: "Vehicle Rental"
  expiresInSeconds: 86400
