name: CI

# Chay khi push len main va khi mo pull request.
# Muc dich: khong bao gio merge duoc code lam do test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huy bot cac lan chay cu neu push lien tuc - do ton tai nguyen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bat cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cap quyen chay cho gradlew
        run: chmod +x ./gradlew

      - name: Bien dich
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Chay test
        run: ./gradlew test --no-daemon

      # Luon tai ket qua len ke ca khi test do - de con doc ma sua
      - name: Luu ket qua test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Chi BUILD de chac chan Dockerfile con dung, khong push len registry.
      # Muon push thi them buoc docker/login-action + docker/build-push-action voi push: true.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vehicle-rental-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  config-check:
    name: Kiem tra cau hinh production
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # Bat loi som: ai do vo tinh commit secret that vao file cau hinh mac dinh.
      - name: Khong duoc co secret that trong application.yaml
        run: |
          if grep -qE 'secret:\s*"(?!dev-only)' src/main/resources/application.yaml; then
            echo "application.yaml co ve dang chua secret that!"
            exit 1
          fi
          echo "OK: application.yaml chi chua gia tri dev"

      - name: File .env khong duoc commit
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env da bi commit len Git - phai go ra ngay va doi toan bo secret!"
            exit 1
          fi
          echo "OK: .env khong nam trong Git"
